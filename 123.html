<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Dancing+Script:wght@500;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night: #150f2b;
    --night-deep: #0b0818;
    --plum: #3d2b56;
    --rose: #e8a6b0;
    --rose-deep: #c96e82;
    --gold: #e8c789;
    --cream: #f8ede0;
    --star: #fff6e6;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% 0%, var(--plum) 0%, var(--night) 55%, var(--night-deep) 100%);
    overflow-x:hidden;
    font-family: 'Cormorant Garamond', serif;
    color: var(--cream);
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
  }

  /* ---------- Starfield ---------- */
  .stars{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }
  .star{
    position:absolute;
    background: var(--star);
    border-radius:50%;
    opacity:.7;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; transform:scale(.8); }
    50%{ opacity:1; transform:scale(1.2); }
  }

  .shooting-star{
    position:fixed;
    top:10%;
    left:-10%;
    width:2px;
    height:2px;
    background: linear-gradient(90deg, var(--gold), transparent);
    border-radius:50%;
    box-shadow: 0 0 0 1px rgba(255,255,255,.1);
    animation: shoot 7s linear infinite;
    animation-delay: 2s;
    opacity:0;
    z-index:0;
  }
  @keyframes shoot{
    0%{ transform: translate(0,0); opacity:0; }
    3%{ opacity:1; }
    18%{ transform: translate(60vw, 32vh); opacity:0; }
    100%{ opacity:0; }
  }

  /* ---------- Envelope scene ---------- */
  .scene{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    width:100%;
    max-width:520px;
  }

  .prompt{
    font-family:'Dancing Script', cursive;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: var(--rose);
    letter-spacing:.5px;
    text-align:center;
    animation: floaty 3.5s ease-in-out infinite;
    text-shadow: 0 0 18px rgba(232,166,176,.35);
  }
  @keyframes floaty{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-8px); }
  }

  .envelope-wrap{
    position:relative;
    width: min(88vw, 340px);
    aspect-ratio: 3 / 2;
    cursor:pointer;
    perspective: 1400px;
    filter: drop-shadow(0 25px 45px rgba(0,0,0,.55));
  }

  .envelope-wrap.opened{ cursor: default; }

  .env-back{
    position:absolute;
    inset:0;
    background: linear-gradient(155deg, #4a3468, #2c1f45 60%, #201535);
    border-radius: 6px;
    overflow:hidden;
    box-shadow: inset 0 0 0 1px rgba(232,199,137,.18);
  }

  .env-back::before{
    /* side triangles giving the envelope its folded look */
    content:"";
    position:absolute;
    inset:0;
    background:
      linear-gradient(135deg, rgba(0,0,0,.28) 49.6%, transparent 50.4%),
      linear-gradient(-135deg, rgba(0,0,0,.28) 49.6%, transparent 50.4%);
  }

  .letter{
    position:absolute;
    left:6%;
    right:6%;
    top:8%;
    height: 84%;
    background: linear-gradient(180deg, var(--cream), #f1e3d0);
    border-radius: 4px;
    box-shadow: 0 8px 22px rgba(0,0,0,.35);
    transition: transform 1.1s cubic-bezier(.6,.05,.2,1), top 1.1s cubic-bezier(.6,.05,.2,1);
    z-index:2;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 10%;
    text-align:center;
  }

  .letter-glyph{
    font-family:'Dancing Script', cursive;
    font-size: clamp(1.1rem, 4vw, 1.5rem);
    color: var(--rose-deep);
    opacity:.85;
  }

  .opened .letter{
    top:-92%;
    transform: translateY(0) scale(1.04);
  }

  .env-front{
    position:absolute;
    inset:0;
    z-index:3;
    background: linear-gradient(160deg, #5b3f80, #3a2856 65%);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
  }

  .flap{
    position:absolute;
    top:0; left:0; right:0;
    height:55%;
    background: linear-gradient(200deg, #6b4a92, #402d5e 70%);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform 1s cubic-bezier(.6,.05,.2,1);
    z-index:5;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
  }

  .opened .flap{
    transform: rotateX(178deg);
    z-index:1;
  }

  .env-body{
    position:absolute;
    inset:0;
    z-index:2;
    background: linear-gradient(160deg, #573c7c, #33234c 70%);
    clip-path: polygon(0 100%, 50% 45%, 100% 100%);
  }

  .seal{
    position:absolute;
    top:50%; left:50%;
    transform: translate(-50%,-50%);
    width:56px; height:56px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #f0d093, var(--gold) 55%, #b98a3f 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.15);
    z-index:6;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4rem;
    color: #5c3a1e;
    transition: transform .5s ease, opacity .5s ease;
    animation: pulse-seal 2.6s ease-in-out infinite;
  }
  @keyframes pulse-seal{
    0%,100%{ box-shadow: 0 4px 10px rgba(0,0,0,.4), 0 0 0 0 rgba(232,199,137,.5); }
    50%{ box-shadow: 0 4px 10px rgba(0,0,0,.4), 0 0 0 10px rgba(232,199,137,0); }
  }

  .opened .seal{
    opacity:0;
    transform: translate(-50%,-50%) scale(0.4) rotate(35deg);
  }

  .hint{
    margin-top: 2px;
    font-size: .95rem;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(248,237,224,.55);
    transition: opacity .5s ease;
  }
  .opened + .hint, .scene.opened .hint{ opacity:0; }

  /* ---------- Message reveal ---------- */
  .message-area{
    position:relative;
    z-index:2;
    width:100%;
    max-width:640px;
    text-align:center;
    margin-top: 10px;
    display:none;
    flex-direction:column;
    align-items:center;
    gap: 22px;
  }
  .message-area.show{ display:flex; }

  .miss-line{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size: clamp(2.4rem, 9vw, 4.2rem);
    color: var(--rose);
    text-shadow: 0 0 30px rgba(232,166,176,.45);
    opacity:0;
    transform: translateY(18px);
    animation: rise-in 1s ease forwards;
    animation-delay: .2s;
  }

  .sub-line{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 2.6vw, 1.35rem);
    color: rgba(248,237,224,.75);
    max-width: 34ch;
    line-height:1.6;
    opacity:0;
    transform: translateY(18px);
    animation: rise-in 1s ease forwards;
    animation-delay: .9s;
  }

  @keyframes rise-in{
    to{ opacity:1; transform:translateY(0); }
  }

  .reveal-btn{
    margin-top: 6px;
    background: linear-gradient(135deg, var(--rose-deep), #a84f66);
    color: var(--cream);
    border: 1px solid rgba(248,237,224,.35);
    padding: 14px 34px;
    border-radius: 999px;
    font-family:'Cinzel', serif;
    font-size: .78rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor:pointer;
    opacity:0;
    transform: translateY(18px);
    animation: rise-in 1s ease forwards;
    animation-delay: 1.6s;
    box-shadow: 0 10px 28px rgba(201,110,130,.35);
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .reveal-btn:hover{
    transform: translateY(-3px);
    box-shadow: 0 16px 34px rgba(201,110,130,.5);
  }
  .reveal-btn:focus-visible{
    outline: 2px solid var(--gold);
    outline-offset: 3px;
  }
  .reveal-btn.hidden{ display:none; }

  /* ---------- I Love You finale ---------- */
  .finale{
    display:none;
    flex-direction:column;
    align-items:center;
    gap: 18px;
  }
  .finale.show{ display:flex; }

  .love-line{
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size: clamp(2.1rem, 8vw, 3.6rem);
    letter-spacing: 2px;
    background: linear-gradient(120deg, var(--gold), var(--rose) 55%, var(--gold));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 3.5s linear infinite, heartbeat 1.8s ease-in-out infinite;
    filter: drop-shadow(0 0 22px rgba(232,199,137,.35));
  }
  @keyframes shine{
    to{ background-position: 200% center; }
  }
  @keyframes heartbeat{
    0%,100%{ transform: scale(1); }
    10%{ transform: scale(1.06); }
    20%{ transform: scale(1); }
    30%{ transform: scale(1.09); }
    40%{ transform: scale(1); }
  }

  .love-sub{
    font-family:'Dancing Script', cursive;
    font-size: clamp(1.1rem, 3vw, 1.6rem);
    color: rgba(248,237,224,.8);
  }

  /* ---------- Floating hearts ---------- */
  .hearts{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:1;
    overflow:hidden;
  }
  .heart{
    position:absolute;
    bottom:-10%;
    color: var(--rose);
    opacity:.85;
    animation: floatUp linear forwards;
    filter: drop-shadow(0 0 6px rgba(232,166,176,.5));
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:.9; }
    90%{ opacity:.6; }
    100%{ transform: translateY(-115vh) translateX(var(--drift, 20px)) rotate(25deg); opacity:0; }
  }

  footer.signature{
    position:relative;
    z-index:2;
    margin-top: 34px;
    font-family:'Dancing Script', cursive;
    font-size: 1rem;
    color: rgba(248,237,224,.4);
    letter-spacing:.5px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="shooting-star"></div>
<div class="hearts" id="hearts"></div>

<div class="stage">
  <div class="scene" id="scene">

    <p class="prompt" id="prompt">a little something is waiting for you...</p>

    <div class="envelope-wrap" id="envelope" role="button" tabindex="0" aria-label="Open the envelope">
      <div class="env-back"></div>
      <div class="letter"><span class="letter-glyph">✦</span></div>
      <div class="env-front">
        <div class="env-body"></div>
        <div class="flap"></div>
        <div class="seal">♥</div>
      </div>
    </div>

    <p class="hint" id="hint">tap the envelope</p>

    <div class="message-area" id="messageArea">
      <p class="miss-line">I miss you.</p>
      <p class="sub-line">More than the quiet hours say, more than these words can hold — I miss you in the small moments and the big ones alike.</p>
      <button class="reveal-btn" id="revealBtn">one more thing</button>

      <div class="finale" id="finale">
        <p class="love-line">I love you.</p>
        <p class="love-sub">now and always, endlessly.</p>
      </div>
    </div>

  </div>
</div>

<footer class="signature">— with all my heart</footer>

<script>
  // starfield
  const starsEl = document.getElementById('stars');
  const STAR_COUNT = 90;
  for(let i=0;i<STAR_COUNT;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2 + 0.6;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.top = Math.random()*100+'%';
    s.style.left = Math.random()*100+'%';
    s.style.animationDelay = (Math.random()*3.5)+'s';
    s.style.animationDuration = (2.5 + Math.random()*3)+'s';
    starsEl.appendChild(s);
  }

  // floating hearts ambient
  const heartsEl = document.getElementById('hearts');
  function spawnHeart(){
    const h = document.createElement('div');
    h.className = 'heart';
    h.innerHTML = '♥';
    const size = 10 + Math.random()*18;
    h.style.fontSize = size+'px';
    h.style.left = Math.random()*100+'%';
    h.style.setProperty('--drift', (Math.random()*80-40)+'px');
    const dur = 8 + Math.random()*6;
    h.style.animationDuration = dur+'s';
    heartsEl.appendChild(h);
    setTimeout(()=>h.remove(), dur*1000);
  }
  setInterval(spawnHeart, 900);
  for(let i=0;i<4;i++) setTimeout(spawnHeart, i*400);

  // envelope open interaction
  const envelope = document.getElementById('envelope');
  const scene = document.getElementById('scene');
  const messageArea = document.getElementById('messageArea');
  const prompt = document.getElementById('prompt');
  const hint = document.getElementById('hint');
  let opened = false;

  function openEnvelope(){
    if(opened) return;
    opened = true;
    envelope.classList.add('opened');
    hint.style.opacity = '0';
    prompt.style.transition = 'opacity .6s ease';
    prompt.style.opacity = '0';
    setTimeout(()=>{
      messageArea.classList.add('show');
    }, 750);
  }

  envelope.addEventListener('click', openEnvelope);
  envelope.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openEnvelope(); }
  });

  // finale reveal
  const revealBtn = document.getElementById('revealBtn');
  const finale = document.getElementById('finale');
  revealBtn.addEventListener('click', ()=>{
    finale.classList.add('show');
    revealBtn.classList.add('hidden');
    // heart burst
    for(let i=0;i<26;i++) setTimeout(spawnHeart, i*60);
  });
</script>

</body>
</html>
